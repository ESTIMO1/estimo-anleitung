<!DOCTYPE html>

<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ESTIMO – Spielanleitung</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #07111f;

      color: white;

      text-align: center;

    }

    .container {

      max-width: 600px;

      margin: auto;

      padding: 70px 24px;

    }

    h1 {

      font-size: 54px;

      font-weight: 400;

      margin: 0 0 10px 0;

    }

    .colors {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin: 0 0 50px 0;

    }

    .colors span {

      width: 55px;

      height: 8px;

      display: block;

    }

    .red { background: #d92828; }

    .blue { background: #174f96; }

    .yellow { background: #e4a313; }

    .green { background: #34782d; }

    h2 {

      font-size: 28px;

      margin: 0 0 16px 0;

    }

    p {

      font-size: 18px;

      line-height: 1.5;

      color: #d8dce3;

      margin-bottom: 30px;

    }

    .button {

      display: inline-block;

      padding: 16px 28px;

      background: white;

      color: #07111f;

      text-decoration: none;

      border-radius: 12px;

      font-weight: bold;

      font-size: 18px;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>ESTIMO</h1>

    <div class="colors">

      <span class="red"></span>

      <span class="blue"></span>

      <span class="yellow"></span>

      <span class="green"></span>

    </div>

    <h2>Spielanleitung</h2>

    <p>

      Hier findest du die vollständige Spielanleitung für ESTIMO.

    </p>

    <a class="button" href="SCHÄTZUNG.Spielanleitung.pdf">

      Spielanleitung öffnen

    </a>

  </div>

</body>

</html>
